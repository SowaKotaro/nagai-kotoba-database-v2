<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ページが見つかりません (404) | 長い言葉のデータベース</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    /* 静的ページのため、デザイントークンの値をリテラルで持つ(docs/design.md)。 */
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: flex; align-items: center; justify-content: center;
      background: #FAFAFA; color: #2F2725; line-height: 1.9; letter-spacing: .08em;
      font-family: "Avenir Next", "Noto Sans JP", "Yu Gothic Medium", "游ゴシック Medium", YuGothic,
                   "Hiragino Kaku Gothic ProN", "Hiragino Kaku Gothic Pro", Meiryo, sans-serif;
      font-feature-settings: "palt";
    }
    .box { width: 100%; max-width: 30em; text-align: center; }
    .code { margin: 0 0 8px; font-size: 12px; color: #6A605C; }
    h1 { margin: 0 0 16px; font-size: 20px; font-weight: 800; letter-spacing: .06em; }
    p { margin: 0 0 32px; color: #5C4E4A; font-size: 14px; }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .links a {
      color: #2F2725; text-decoration: none; border: 1px solid #2F2725; border-radius: 8px;
      padding: 8px 20px; font-size: 14px;
    }
    .links a:hover { background: #EBE9E7; }
    @media (prefers-color-scheme: dark) {
      body { background: #262120; color: #F2EEEC; }
      .code { color: #B0A6A2; }
      p { color: #C8BEBB; }
      .links a { color: #F2EEEC; border-color: #F2EEEC; }
      .links a:hover { background: #120E0D; }
    }
  </style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは見つかりませんでした。URL が変更されたか、削除された可能性があります。</p>
    <div class="links">
      <a href="/">ホーム</a>
      <a href="/words">単語一覧</a>
      <a href="/search">検索</a>
    </div>
  </div>
</body>
</html>
