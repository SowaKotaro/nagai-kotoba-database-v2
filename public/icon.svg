     単体ファイルなので色はトークンと同値をリテラルで持つ(札は surface トークンの #FFFFFF、墨は text トークンの #2F2725)。
     白い札は、タブがライトでもダークでも沈まないので、prefers-color-scheme での入れ替えは持たない。 -->
