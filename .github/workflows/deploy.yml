# main への push(PR の merge を含む)で、本番へ自動でデプロイする(bundle exec cap production deploy)。
# CI(ci.yml)の完了は待たない。CI が落ちてもデプロイは止まらないので、merge の前に PR 上の CI を確かめる。
# NAGAI_KOTOBA_DATABASE_V2_PASSWORD は渡しているが、本番では使われていない
# (サーバ上の config/database.yml がパスワードを持つ。docs/issues.md 確定事項 28)。
name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with Capistrano
        env:
          NAGAI_KOTOBA_DATABASE_V2_PASSWORD: ${{ secrets.NAGAI_KOTOBA_DATABASE_V2_PASSWORD }}
        run: bundle exec cap production deploy