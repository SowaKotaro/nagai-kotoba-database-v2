# 言語学的特徴の用語解説(単一ソース)。docs/annotation-guidelines.md §7 から参照される。
# name は seed カタログ(app/models/seed_catalog.rb の LINGUISTIC_FEATURES)と1対1で対応させる(テストで担保)。
# description は言語学的な説明(このデータベースで付ける範囲を要約した1文を添えてよい)、
# examples は「もと → 実際の形(変化の説明)」形式の、その現象が起きている具体例3〜5件(起きない例は description に書く)。
# アノテーション・コンソールの「用語解説」パネル(LinguisticFeatureGlossary)がこれを表示する。
# どの語のどこに付けるか(付けない条件・隣の特徴との切り分け・target の切り方・出典)は、
# 注釈スキルの判定の手引き(.claude/skills/word-annotation-research/linguistic-features.md)が正。
# description に添えた範囲の1文はその要約なので、食い違ったら手引きに合わせて直す。
features:
  # --- 読みの変化(連濁系) ---
  - name: 連濁
    description: 複合語を作るとき、後ろの要素の語頭の清音(カ・サ・タ・ハ行)が濁音に変わる現象。和語に多いが、漢語(撥音の後など)やかな書きの語にも起こる。後ろの要素の中にすでに濁音がある語(ライマンの法則。青鷺 あおさぎ)、オノマトペの畳語、外来語、「AとB」の意味の並列の複合では起こらない。
    examples:
      - 硫黄 + 島 → いおうじま（シマ → ジマ）
      - 手 + 紙 → てがみ（カミ → ガミ）
      - 青 + 空 → あおぞら（ソラ → ゾラ）
      - 銀 + 河 → ぎんが（カ → ガ。漢語の連濁）
  - name: 半濁音化
    description: 促音「っ」・撥音「ん」の直後で、後ろの要素の語頭のハ行音が半濁音(パ行)に変わる現象。漢語と数詞＋助数詞に多い。撥音の後でバ行になるもの(三本 さんぼん)は連濁。
    examples:
      - 出 + 発 → しゅっぱつ（ハツ → パツ）
      - 切 + 符 → きっぷ（フ → プ）
      - 一 + 本 → いっぽん（ホン → ポン）
      - 散 + 歩 → さんぽ（ホ → ポ。撥音の後）
  - name: ハ行転呼
    description: 語頭以外の位置にあるハ行音(は・ひ・ふ・へ・ほ)が、ワ行系の音(わ・い・う・え・お)に変わる歴史的な音韻現象。平安時代に広く起こり、10世紀後半〜11世紀前半に一般化したとされる。このデータベースでは、単独ではハ行で読む要素が複合語の中でワ行系で読まれるときに付ける(川 かわ・顔 かお のように単独の語の中で起きて定着したものには付けない)。もとの音が消える音韻脱落や、ハ行が半濁音(パ行)に変わる半濁音化とは変化の向きが異なる。
    examples:
      - 菅(すが) + 原(はら) → すがわら（ハラ → ワラ）
      - 藤(ふじ) + 原(はら) → ふじわら（ハラ → ワラ）
      - 萩(はぎ) + 原(はら) → はぎわら（ハラ → ワラ）
      - 小田(おだ) + 原(はら) → おだわら（ハラ → ワラ）
  - name: 連声
    description: 字音の末尾の子音(ン=-n・-m、ツ・チ=-t)が、後ろに続くア・ヤ・ワ行の音と結びついてナ行・マ行・タ行の音に変わる現象。現代では一部の語に固定しており、新しい語には起こらない。
    examples:
      - 反 + 応 → はんのう（オウ → ノウ）
      - 三 + 位 → さんみ（イ → ミ）
      - 観 + 音 → かんのん（オン → ノン）
      - 因 + 縁 → いんねん（エン → ネン）
      - 雪 + 隠 → せっちん（イン → チン）
  - name: 音韻添加
    description: 複合語を作るとき、もとの語には無い音が間に加わる現象。「雨(あめ)」が後ろに付くとき頭に「さ」が加わる型や、接頭辞「真」の後に促音・撥音が加わる型がある。もとからある音が促音に置き換わる促音化とは区別する。
    examples:
      - 真 + 中 → まんなか（ン が加わる）
      - 春 + 雨 → はるさめ（サ が加わる）
      - 小 + 雨 → こさめ（サ が加わる）
      - 真 + 白 → まっしろ（ッ が加わる）
  - name: 音韻脱落
    description: 複合や語形成の際に、もとの語にあった音が落ちる現象。口語の縮約も含む。2つの語の重なる同じ音の片方が落ちた語(テレビ＋ビデオ→テレビデオ)には、ゴママヨキャンセルと両方付ける。
    examples:
      - 河(かわ) + 原(はら) → かわら（ハ が落ちる）
      - 乞食(こつじき) → こじき（ツ が落ちる）
      - こんにちは → こんちは（口語での脱落）
      - すみません → すいません（口語での脱落）
  - name: 転音
    description: 複合語を作るとき、前の要素の末尾の母音が別の母音に交替する現象。単独で使う形(露出形)に対し、複合語の前に立つ形を被覆形と呼ぶ。後ろの要素が濁るときは連濁も起きている(雨傘)。
    examples:
      - 雨(あめ) + 傘 → あまがさ（メ → マ）
      - 酒(さけ) + 屋 → さかや（ケ → カ）
      - 船(ふね) + 乗り → ふなのり（ネ → ナ）
      - 木(き) + 陰 → こかげ（キ → コ）
      - 手(て) + 綱 → たづな（テ → タ）
  - name: 促音化
    description: 複合語を作るとき、前の要素の末尾の音(チ・ツ・ク・キ)が促音「ッ」に変わる現象。字音では、末尾がチ・ツなら後ろがカ・サ・タ・ハ行のとき、末尾がク・キなら主に後ろがカ行のときに起こる(起こらない語もある)。もとに無い音が加わる音韻添加とは違い、既にある音が置き換わる。活用語尾に「て・た」が続くときの「ッ」は促音便。
    examples:
      - 活(かつ) + 版 → かっぱん（ツ → ッ）
      - 一(いち) + 回 → いっかい（チ → ッ）
      - 学(がく) + 校 → がっこう（ク → ッ）
      - 実(じつ) + 際 → じっさい（ツ → ッ）
      - 日(にち) + 記 → にっき（チ → ッ）
  # --- 漢字の読みの当て方 ---
  - name: 熟字訓
    description: 漢字1字ずつではなく、熟語全体に対してまとめて訓読みを当てた読み方。字の意味は語の意味と合っている(意味と無関係に音を借りたものは当て字)。常用漢字表の付表(文化庁)は、熟字訓・当て字など、1字1字の音訓では読めない語を掲げている。
    examples:
      - 五月雨 → さみだれ
      - 硫黄 → いおう
      - 大人 → おとな
      - 田舎 → いなか
      - 土産 → みやげ
  - name: 重箱読み
    description: 二字熟語で、前の字を音読み・後ろの字を訓読みで読む読み方。長い語の中の二字の部分にも付ける。
    examples:
      - 重箱 → ジュウ(音) + ばこ(訓)
      - 台所 → ダイ(音) + どころ(訓)
      - 番組 → バン(音) + ぐみ(訓)
      - 額縁 → ガク(音) + ぶち(訓)
  - name: 湯桶読み
    description: 二字熟語で、前の字を訓読み・後ろの字を音読みで読む読み方(重箱読みの逆)。長い語の中の二字の部分にも付ける。
    examples:
      - 湯桶 → ゆ(訓) + トウ(音)
      - 手本 → て(訓) + ホン(音)
      - 見本 → み(訓) + ホン(音)
      - 夕刊 → ゆう(訓) + カン(音)
  - name: 当て字
    description: 漢字の意味とは無関係に、音や訓だけを借りて漢字を当てた表記(またはその読み)。外来語の音写(珈琲・倶楽部)と、和語・俗語への音借り(目出度い・滅茶苦茶)がある。字の意味に合わせて和語を当てたものは熟字訓。
    examples:
      - 目出度い → めでたい
      - 珈琲 → コーヒー
      - 倶楽部 → クラブ
      - 滅茶苦茶 → めちゃくちゃ
  - name: 古式読み
    description: 現代の読み方が定着する以前の、古い時代の読み方・語形を保った読み。古代人名の姓と名の間に「の」を挟む読み、表記に無い「の」を補って読む古い題名、古語の語形を保つ訓などがある。
    examples:
      - 中臣鎌足 → なかとみのかまたり（「の」を挟む）
      - 蘇我馬子 → そがのうまこ（「の」を挟む）
      - 天叢雲剣 → あめのむらくものつるぎ（天を古語の「あめ」で読み、「の」を補う）
      - 女神 → めがみ（女を古い語形の「め」で読む）
      - 傘 → からかさ（古い語形）
  - name: 特殊読み
    description: 一般の読みの規則によらず、作品・商標・分野などの慣習で表記に固有の読みを与えたもの(いわゆる当てルビを含む)。数字や略号を慣習的に読むもの、字面から読めない名乗り訓も含む。欧字を字母どおりに読むもの(NTT)や、国語辞典に載る熟字訓は含まない。
    examples:
      - 青眼の白龍 → ブルーアイズ・ホワイト・ドラゴン
      - 本気 → マジ（当てルビ）
      - 宇宙 → そら（当てルビ）
      - 999 → スリーナイン（銀河鉄道999）
      - No. → ナンバー（略号の慣習読み）
  # --- 音便(4種) ---
  - name: イ音便
    description: 活用などの際に「き・ぎ」などの音が「い」に変わる音便。
    examples:
      - 書きて → 書いて
      - 咲きて → 咲いて
      - 急ぎて → 急いで
  - name: 促音便
    description: 活用などの際に「ち・り・ひ」などの音が促音「っ」に変わる音便。
    examples:
      - 立ちて → 立って
      - 取りて → 取って
      - 買ひて → 買って
  - name: 撥音便
    description: 活用などの際に「に・び・み」などの音が撥音「ん」に変わる音便。
    examples:
      - 死にて → 死んで
      - 飛びて → 飛んで
      - 読みて → 読んで
  - name: ウ音便
    description: 活用などの際に「く・ぐ・ひ・び・み」などの音が「う」に変わる音便。形容詞の連用形に「ございます」などが続く形(ありがとう)に多い。
    examples:
      - ありがたく → ありがとう
      - おめでたく → おめでとう
      - 美しく → 美しゅう
      - 問ひて → 問うて
  # --- 語形成 ---
  - name: 畳語
    description: 同じ語基を繰り返して1語を作る語形成。漢字の「々」、かな、欧字の繰り返しを問わない。オノマトペでない和語の畳語は後部で連濁することが多いが、オノマトペの畳語は連濁しない。
    examples:
      - 人 + 人 → 人々（ひとびと）
      - 時 + 時 → 時々（ときどき）
      - 国 + 国 → 国々（くにぐに）
      - 戦 + 戦 → 戦々（せんせん。戦々恐々）
      - しく + しく → しくしく（オノマトペの畳語は連濁しない）
  # --- オノマトペ ---
  - name: オノマトペ（擬音語）
    description: 実際に鳴っている音・声をまねて作られた語(擬声語を含む)。反復(ABAB)・促音(ABッ)・撥音(ABン)・「り」(ABリ)・長音などの決まった語形をとることが多い。
    examples:
      - わんわん（犬の声）
      - ざあざあ（雨の音）
      - がちゃん（物がぶつかる音）
      - ごろごろ（雷の音）
  - name: オノマトペ（擬態語）
    description: 音のしない状態・様子・心情を、音の感覚に写して表した語(擬容語・擬情語を含む)。擬音語と同じく、反復・促音・撥音・「り」などの決まった語形をとることが多い。
    examples:
      - きらきら（光る様子）
      - うろうろ（歩き回る様子）
      - いらいら（心情）
      - もっちり（感触・様子）
  # --- 言葉遊び(ゴママヨ系の4種。呼び名はしなちくシステムの用語集による) ---
  - name: ゴママヨ
    description: 2つ以上の語(形態素)が結合した複合語のうち、結合部分で同じ音(モーラ)が連続するもの、またはその現象を指す言葉遊び。「ゴマ」＋「マヨネーズ」の接続部で「マ」が連続することに由来する。このデータベースでは、連続が1モーラのものをこの名前で付け、2モーラ以上は高次ゴママヨ、音は続かず文字だけが続くものはビジュアルゴママヨとして分ける。音は発音で比べるので、長音でつながるもの(希望皇 きぼー＋おー)も含む。助詞・助動詞の前後、欧字で書かれた語どうしの境目(King Gnu、OVER THE END)、字音どうしの二字漢語の内部(基金 き＋きん)、欧字を1字ずつ読む略号の内部(NTT)、同じ語の繰り返し(畳語)の内部には付けない。結合部が2か所以上ある語(多項ゴママヨ)には、結合部ごとに付ける。
    examples:
      - ゴマ + マヨネーズ → ごままよねーず（「マ」が連続）
      - 安田 + 大サーカス → やすだだいさーかす（「ダ」が連続）
      - 福山 + 雅治 → ふくやままさはる（「マ」が連続）
      - 希望 + 皇 → きぼうおう（発音では「きぼー」＋「おー」で「オ」が連続）
  - name: 高次ゴママヨ
    description: ゴママヨのうち、結合部分で同じ音の並びが2モーラ以上連続するもの。このデータベースでは、1つの結合部にはゴママヨと高次ゴママヨのどちらか一方だけを付ける。
    examples:
      - 博麗 + 霊夢 → はくれいれいむ（「レイ」が連続）
      - 株式公開 + 買い付け → かぶしきこうかいかいつけ（「カイ」が連続）
      - 部分 + 分数 → ぶぶんぶんすう（「ブン」が連続）
      - Gパン + パンダ → じーぱんぱんだ（「パン」が連続）
  - name: ビジュアルゴママヨ
    description: 結合部分で、発音としては同じ音が続かないが、文字が連続して見えるもの(診療受付 しんりょう＋うけつけ は、発音では「りょー」＋「う」)。このデータベースでは、読みのかなで続くものと、表層形の漢字で続くものの両方に付ける。発音でも続くものには、ゴママヨか高次ゴママヨを付ける。
    examples:
      - 診療 + 受付 → しんりょううけつけ（かなで「う」が連続）
      - 南高 + 梅 → なんこううめ（かなで「う」が連続）
      - 両国 + 国技館 → りょうごくこくぎかん（字で「国」が連続。音は「ごく」＋「こく」）
      - 山椒 + 魚 → さんしょううお（かなで「う」が連続）
  - name: ゴママヨキャンセル
    description: 2つの語を結合すると結合部分で同じ音が連続する(ゴママヨになる)ところを、重なる音を1つにまとめて縮めた語。重なる音の片方が落ちているので、このデータベースでは音韻脱落も同じ該当部分に付ける。
    examples:
      - テレビ + ビデオ → てれびでお（「ビ」を1つにまとめる）
      - シネマ + マイレージ → しねまいれーじ（「マ」を1つにまとめる）
      - ニコニコ + 広告 → にこにこうこく（ニコニ広告。「コ」を1つにまとめる）
      - 熱さまし + シート → ねつさましーと（熱さまシート。「シ」を1つにまとめる）
